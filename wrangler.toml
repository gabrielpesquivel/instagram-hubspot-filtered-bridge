name = "bootink-internal-tools"
main = "src/index.ts"
compatibility_date = "2025-02-10"

# Custom domain — UNCOMMENT once the bootink.com zone is added to this
# Cloudflare account (DNS currently at GoDaddy; Workers custom domains
# require the zone on Cloudflare). Auto-creates DNS record + certificate;
# workers.dev URL keeps working alongside, so Meta webhook/OAuth unaffected.
# [[routes]]
# pattern = "tools.bootink.com"
# custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Durable Object owning mutable shared state (pending queue, conversations,
# blocklist, stats, logs, webhook dedup) — serializes writes that raced on KV
[[durable_objects.bindings]]
name = "DM_STATE"
class_name = "DMState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DMState"]

# Daily Meta token refresh check (03:00 UTC)
[triggers]
crons = ["0 3 * * *"]

# KV namespace for caching Instagram profiles
[[kv_namespaces]]
binding = "PROFILE_CACHE"
id = "db904047158e47118ea28704c475a41b"

# R2 bucket storing daily gangsheet uploads (keyed gangsheets/<YYYY-MM-DD>/<name>)
[[r2_buckets]]
binding = "GANGSHEET_FILES"
bucket_name = "bootink-gangsheets"

# Environment variables (non-secret)
[vars]
FILTER_MIN_FOLLOWERS = "5000"
CACHE_TTL_SECONDS = "86400"
# Shopify Admin API (read-only order lookup — dedicated custom app, not the bundling app)
SHOPIFY_STORE_DOMAIN = "u6pzrv-8k.myshopify.com"
SHOPIFY_API_VERSION = "2026-04"

# Secrets (set via `wrangler secret put <NAME>`):
# - META_APP_ID
# - META_APP_SECRET
# - INSTAGRAM_APP_SECRET
# - META_PAGE_ACCESS_TOKEN
# - INSTAGRAM_PAGE_ID
# - WEBHOOK_VERIFY_TOKEN
# - GEMINI_API_KEY
# - DASHBOARD_PASSWORD
# - GOOGLE_CLIENT_ID       (Email Manager — Gmail OAuth)
# - GOOGLE_CLIENT_SECRET   (Email Manager — Gmail OAuth)
# - SHOPIFY_CLIENT_ID      (Shopify order lookup — Dev Dashboard app client ID)
# - SHOPIFY_CLIENT_SECRET  (Shopify order lookup — client secret; exchanged for a 24h token)
#                          NOTE: order WRITE actions (address/email/cancel/refund/
#                          duplicate/add) need the `write_orders` scope on this app.
# - STARSHIPIT_API_KEY          (StarShipit account API key — order writes; optional)
# - STARSHIPIT_SUBSCRIPTION_KEY (StarShipit developer subscription key; optional)
#                          When unset, StarShipit writes are skipped; Shopify writes still run.
